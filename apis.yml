aid: infinit
name: INFINIT
description: >-
  INFINIT is an AI application for Web3 financial execution that lets anyone
  research, create, and execute DeFi and trading strategies through AI agents.
  Its Prompt-to-DeFi experience turns natural-language intents into agent-powered,
  one-workflow on-chain strategies, and its AI-managed trading vault marketplace
  lets independent strategy managers deploy non-custodial vaults that depositors
  access through a single workflow. For developers, INFINIT publishes the
  open-source INFINIT Library and INFINIT CLI — a TypeScript action framework and
  command-line tool for programmatically deploying and interacting with DeFi
  protocols including Aave v3, Uniswap v3, Pendle, and INIT Capital, distributed
  as npm packages under the @infinit-xyz scope. Backed by Electric Capital and
  EQT Ventures.
